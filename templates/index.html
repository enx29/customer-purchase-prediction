<!DOCTYPE html>
<html lang="en">
<head>
    <title>Customer Purchase Prediction</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            font-family: 'Poppins', sans-serif;
            height: 100vh;
        }

        .card {
            border-radius: 20px;
            padding: 30px;
        }

        .title {
            font-weight: 600;
            color: #2a5298;
        }

        .btn-custom {
            background-color: #2a5298;
            color: white;
            border-radius: 10px;
        }

        .btn-custom:hover {
            background-color: #1e3c72;
        }

        .result {
            font-size: 20px;
            font-weight: 500;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-lg col-md-6">

        <h2 class="text-center title mb-4">Customer Purchase Prediction</h2>

        <form action="/predict" method="post">

            <div class="mb-3">
                <label class="form-label">Gender</label>
                <select name="gender" class="form-select">
                    <option value="1">Male</option>
                    <option value="0">Female</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Age</label>
                <input type="number" name="age" class="form-control" placeholder="Enter age" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Estimated Salary</label>
                <input type="number" name="salary" class="form-control" placeholder="Enter salary" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-custom">Predict</button>
            </div>

        </form>

        {% if prediction_text %}
            <div class="alert alert-info text-center result">
                {{ prediction_text }}
            </div>
        {% endif %}

    </div>
</div>

</body>
</html>
